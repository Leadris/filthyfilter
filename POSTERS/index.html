<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0a0706" />
    <title>FilthyFilter — návrhy posterov</title>
    <style>
      @font-face{font-family:Oswald;src:url("../assets/fonts/oswald-latin-ext.woff2") format("woff2");font-display:swap}
      @font-face{font-family:Inter;src:url("../assets/fonts/inter-latin-ext.woff2") format("woff2");font-display:swap}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;color:#efe6d6;background:radial-gradient(circle at 50% 0,#20160d,transparent 48%),#0a0706;font-family:Inter,system-ui,sans-serif}.wrap{width:min(980px,100%)}header{display:flex;align-items:center;gap:18px;margin-bottom:34px}header img{width:92px;height:92px;object-fit:contain}h1{margin:0;color:#e8b057;font:700 clamp(2.4rem,7vw,5rem)/.95 Oswald,sans-serif;text-transform:uppercase}header p{margin:.5rem 0 0;color:#c2b49c}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{display:block;padding:28px;border:1px solid #7a4f23;color:#efe6d6;background:linear-gradient(145deg,#1b140d,#0f0b08);text-decoration:none;box-shadow:0 20px 50px #0008;transition:.2s ease}.card:hover,.card:focus-visible{border-color:#e8b057;transform:translateY(-3px);outline:none}.num{color:#c8842f;font:1rem "Share Tech Mono",monospace;letter-spacing:.12em}.card h2{margin:12px 0 8px;color:#f6da9a;font:700 2rem/1 Oswald,sans-serif;text-transform:uppercase}.card p{margin:0;color:#c2b49c;line-height:1.6}.open{display:inline-block;margin-top:24px;color:#e8b057;font-weight:700}@media(max-width:650px){.cards{grid-template-columns:1fr}header{align-items:flex-start}header img{width:72px;height:72px}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <img src="../assets/brand-mark.png" alt="" width="192" height="192" />
        <div><h1>POSTERS</h1><p>Dve interaktívne HTML verzie vizuálu FilthyFilter.</p></div>
      </header>
      <div class="cards">
        <a class="card" href="./v1-neon/">
          <span class="num">VERZIA 01</span>
          <h2>Neónový spis</h2>
          <p>Pôvodná čierno-žltá interpretácia s tromi vymeniteľnými fotografiami.</p>
          <span class="open">Otvoriť verziu →</span>
        </a>
        <a class="card" href="./v2-filthyfilter/">
          <span class="num">VERZIA 02</span>
          <h2>FilthyFilter brand</h2>
          <p>Originálne logo, medená a zlatá škála a tri vymeniteľné fotografie.</p>
          <span class="open">Otvoriť verziu →</span>
        </a>
      </div>
    </main>
  </body>
</html>
